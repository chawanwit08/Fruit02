<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Classifier - Developed by OMOO</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            /* พื้นหลังโทนผลไม้สดใส (ส้ม-เหลือง-พีช) */
            background: linear-gradient(135deg, #fffbeb 0%, #ffedd5 45%, #fed7aa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* กราฟิกผลไม้ตกแต่งลอยรอบฉากหลัง */
        .bg-fruit {
            position: fixed;
            font-size: 4.5rem;
            opacity: 0.22;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        .fruit-1 { top: 8%; left: 6%; animation-delay: 0s; }
        .fruit-2 { top: 12%; right: 8%; animation-delay: 1.5s; }
        .fruit-3 { bottom: 12%; left: 8%; animation-delay: 3s; }
        .fruit-4 { bottom: 10%; right: 6%; animation-delay: 4.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            padding: 32px 28px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(234, 88, 12, 0.12);
            border: 3px solid #fde68a;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* แถบกราฟิกผลไม้ 4 อย่างด้านบนกล่อง */
        .fruit-banner {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .fruit-badge {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            transition: transform 0.25s ease;
        }

        .fruit-badge:hover {
            transform: scale(1.15) rotate(-6deg);
        }

        .fb-1 { background: #fee2e2; border: 2px solid #fca5a5; } /* แอปเปิล/สตรอว์เบอร์รี */
        .fb-2 { background: #fef9c3; border: 2px solid #fde047; } /* กล้วย/สับปะรด */
        .fb-3 { background: #ffedd5; border: 2px solid #fdba74; } /* ส้ม */
        .fb-4 { background: #dcfce7; border: 2px solid #86efac; } /* แตงโม/องุ่น */

        h2 {
            color: #c2410c;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 1.55rem;
        }

        p.subtitle {
            color: #78350f;
            font-size: 0.9rem;
            margin-bottom: 20px;
            opacity: 0.85;
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d97706;
            background: #fef3c7;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 18px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(234, 88, 12, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4);
        }

        .btn-upload:disabled {
            background: #fed7aa;
            color: #9a3412;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        .preview-box {
            width: 100%;
            height: 250px;
            border: 2.5px dashed #fb923c;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            overflow: hidden;
            background-color: #fffaf5;
            position: relative;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 14px;
        }

        .placeholder-text {
            color: #ea580c;
            opacity: 0.6;
            font-size: 0.95rem;
        }

        #label-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            background: #fff7ed;
            border: 1.5px solid #ffedd5;
            padding: 12px 15px;
            border-radius: 14px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #7c2d12;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background-color: #fed7aa;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* ส่วนท้ายเว็บ: Developed by OMOO + แมวส้มเหลือง */
        .footer-credit {
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid #fcd34d;
            box-shadow: 0 6px 15px rgba(217, 119, 6, 0.1);
            z-index: 1;
        }

        .footer-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #9a3412;
            letter-spacing: 0.5px;
        }

        .footer-text span {
            color: #ea580c;
            font-weight: 700;
        }

        .orange-cat {
            width: 38px;
            height: 38px;
            animation: catBounce 2.5s ease-in-out infinite;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(4deg); }
        }
    </style>
</head>
<body>

<!-- กราฟิกผลไม้ 4 ชนิดลอยตกแต่งพื้นหลัง -->
<div class="bg-fruit fruit-1">🍎</div>
<div class="bg-fruit fruit-2">🍌</div>
<div class="bg-fruit fruit-3">🍊</div>
<div class="bg-fruit fruit-4">🍉</div>

<div class="container">
    <!-- กราฟิกผลไม้ 4 อย่างด้านบน -->
    <div class="fruit-banner">
        <div class="fruit-badge fb-1" title="แอปเปิล">🍎</div>
        <div class="fruit-badge fb-2" title="กล้วย">🍌</div>
        <div class="fruit-badge fb-3" title="ส้ม">🍊</div>
        <div class="fruit-badge fb-4" title="แตงโม">🍉</div>
    </div>

    <h2>ระบบจำแนกผลไม้อัจฉริยะ</h2>
    <p class="subtitle">อัปโหลดรูปภาพ 1 ภาพเพื่อให้ AI วิเคราะห์ผลลัพธ์</p>

    <div id="status" class="status-text">กำลังโหลดโมเดล AI...</div>
    <br>

    <div class="upload-btn-wrapper">
        <button class="btn-upload" id="upload-btn" disabled>
            📸 เลือกรูปภาพผลไม้
        </button>
        <input type="file" id="image-upload" accept="image/*" disabled />
    </div>

    <div class="preview-box">
        <span class="placeholder-text" id="placeholder">กดปุ่มด้านบนเพื่อเลือกรูปภาพ</span>
        <img id="image-preview" src="#" alt="Image Preview" crossorigin="anonymous" />
    </div>

    <div id="label-container"></div>
</div>

<!-- เครดิตด้านล่างพร้อมแมวสีส้มเหลือง -->
<footer class="footer-credit">
    <div class="footer-text">Developed by <span>OMOO</span></div>
    <!-- กราฟิก SVG แมวสีส้มเหลือง -->
    <svg class="orange-cat" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- หูซ้าย -->
        <polygon points="18,45 14,12 42,28" fill="#f59e0b" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="21,39 19,20 35,30" fill="#fef08a"/>
        <!-- หูขวา -->
        <polygon points="82,45 86,12 58,28" fill="#f59e0b" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="79,39 81,20 65,30" fill="#fef08a"/>
        <!-- หัวแมว -->
        <ellipse cx="50" cy="56" rx="36" ry="30" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
        <!-- ลายเสือส้มบนหน้าผาก -->
        <path d="M44 27 L44 36 M50 26 L50 38 M56 27 L56 36" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <!-- ลายแก้มซ้าย-ขวา -->
        <path d="M16 55 L24 56 M16 62 L24 61" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M84 55 L76 56 M84 62 L76 61" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
        <!-- ตาซ้าย-ขวา -->
        <circle cx="36" cy="53" r="4.5" fill="#451a03"/>
        <circle cx="34.5" cy="51.5" r="1.5" fill="#ffffff"/>
        <circle cx="64" cy="53" r="4.5" fill="#451a03"/>
        <circle cx="62.5" cy="51.5" r="1.5" fill="#ffffff"/>
        <!-- แก้มชมพู -->
        <ellipse cx="29" cy="61" rx="4.5" ry="2.5" fill="#fb7185" opacity="0.6"/>
        <ellipse cx="71" cy="61" rx="4.5" ry="2.5" fill="#fb7185" opacity="0.6"/>
        <!-- จมูกและปาก -->
        <polygon points="47,60 53,60 50,64" fill="#f43f5e"/>
        <path d="M43 67 Q47 71 50 64 Q53 71 57 67" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/XVRjRyCl8/";

    let model, labelContainer, maxPredictions;

    const imageUpload = document.getElementById('image-upload');
    const imagePreview = document.getElementById('image-preview');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('status');
    const uploadBtn = document.getElementById('upload-btn');

    async function init() {
        try {
            statusText.innerText = "กำลังโหลดโมเดล AI...";
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");

            statusText.innerText = "✅ โมเดลพร้อมใช้งานแล้ว";
            statusText.style.color = "#15803d";
            statusText.style.backgroundColor = "#dcfce7";
            imageUpload.disabled = false;
            uploadBtn.disabled = false;
        } catch (error) {
            statusText.innerText = "❌ โหลดโมเดลไม่สำเร็จ ลองรีเฟรชใหม่นะ";
            statusText.style.color = "#b91c1c";
            statusText.style.backgroundColor = "#fee2e2";
            console.error("Model load error:", error);
        }
    }

    imageUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
            placeholder.style.display = 'none';

            setTimeout(async () => {
                try {
                    await predict();
                } catch (err) {
                    console.error("Prediction error:", err);
                    statusText.innerText = "❌ เกิดข้อผิดพลาดตอนวิเคราะห์ภาพ";
                }
            }, 100);
        };
        reader.readAsDataURL(file);
    });

    async function predict() {
        if (!model) return;
        const prediction = await model.predict(imagePreview);
        prediction.sort((a, b) => b.probability - a.probability);

        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const probability = (prediction[i].probability * 100).toFixed(1);

            // สีแถบผลลัพธ์โทนผลไม้ (อันดับ 1 สีเขียวใบไม้, อันดับรองสีส้ม-เหลือง)
            const barColor = i === 0 ? '#16a34a' : '#f97316';

            const resultHTML = `
                <div class="result-item">
                    <div class="result-header">
                        <span>${i === 0 ? '🏆 ' : ''}${className}</span>
                        <span>${probability}%</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${probability}%; background-color: ${barColor};"></div>
                    </div>
                </div>
            `;
            labelContainer.innerHTML += resultHTML;
        }
    }

    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
